<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onetwenty</title>
<meta name="description" content="120 analoge Uhren, choreografiert – eine digitale Hommage an kinetische Uhrenkunst.">
<style>
  :root {
    --wall: #d9d6cf;
    --ui-bg: rgba(255,255,255,.78);
    --ui-fg: #222;
    --accent: #161616;
    --accent-fg: #fff;
    --panel-shadow: 0 18px 50px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.12);
  }
  :root[data-ui="dark"] { --ui-bg: rgba(18,18,18,.78); --ui-fg: #eee; --panel-shadow: 0 24px 60px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--wall);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ui-fg);
    overflow: hidden;
    display: grid;
    place-items: center;
    transition: background .8s;
  }
  canvas { display: block; border-radius: 3px; box-shadow: var(--panel-shadow); }
  #ui {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center;
    max-width: calc(100vw - 32px);
    padding: 8px; border-radius: 12px;
    background: var(--ui-bg); backdrop-filter: blur(8px);
    transition: opacity .5s;
  }
  body.idle #ui { opacity: 0; pointer-events: none; }
  #ui button, #ui select {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid currentColor; border-radius: 8px;
    padding: 5px 10px; cursor: pointer; opacity: .75;
  }
  #ui select option { color: #111; background: #fff; }
  #ui button:hover, #ui select:hover { opacity: 1; }
  #ui button.on { opacity: 1; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  #ui .sep { width: 1px; align-self: stretch; background: currentColor; opacity: .25; margin: 2px 4px; }
  #status { position: fixed; top: 12px; left: 16px; font-size: 12px; opacity: .55; }
  body.idle #status { opacity: 0; }

  /* Einbettung (iframe) */
  html.embed, html.embed body { background: transparent !important; }
  html.embed #ui, html.embed #status { display: none !important; }
  html.embed canvas { box-shadow: none !important; outline: none !important; border-radius: 0 !important; }

  /* Neobrutalismus */
  :root[data-ui="neo"] { --ui-bg: #fff; --ui-fg: #111; --accent: #8f5cf6; --accent-fg: #fff; }
  :root[data-ui="neo"] canvas { outline: 5px solid #111; border-radius: 4px; box-shadow: 14px 14px 0 #111; }
  :root[data-ui="neo"] #ui { border: 3px solid #111; border-radius: 6px; box-shadow: 6px 6px 0 #111; backdrop-filter: none; font-weight: 700; }
  :root[data-ui="neo"] #ui button, :root[data-ui="neo"] #ui select {
    background: #fff; border: 2.5px solid #111; border-radius: 4px; box-shadow: 3px 3px 0 #111;
    opacity: 1; font-weight: 700; transition: transform .08s, box-shadow .08s;
  }
  :root[data-ui="neo"] #ui button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #111; }
  :root[data-ui="neo"] #ui button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #111; }
  :root[data-ui="neo"] #ui button.on { background: #8f5cf6; color: #fff; border-color: #111; }
  :root[data-ui="neo"] #ui .sep { opacity: 1; width: 3px; }
  :root[data-ui="neo"] #status { font-weight: 800; opacity: 1; text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="ui"></div>

<script>
// ─── Einbettung / Countdown ───────────────────────────────────────────────
// ?countdown=JJJJ-MM-TT  zeigt die verbleibenden Tage statt der Uhrzeit
// ?embed                 ohne Bedienleiste, transparenter Hintergrund (für iframes)
// ?hold=9000             wie lange die Zahl steht, bevor eine Choreografie läuft (ms)
const QP = new URLSearchParams(location.search);
const COUNTDOWN = QP.get('countdown') ? new Date(QP.get('countdown') + 'T00:00:00') : null;
const EMBED = QP.has('embed');
const HOLD = +QP.get('hold') || 9000;
if (EMBED) document.documentElement.classList.add('embed');

// ─── Grundgrößen ──────────────────────────────────────────────────────────
const ROWS = 8, COLS = 18;               // 8 × 18 = 144 Uhren
const PANEL_W = COLS + .8, PANEL_H = ROWS + .8;  // Seitenverhältnis folgt dem Raster

// Winkel in Grad: 0 = 12 Uhr, im Uhrzeigersinn
const mod = (a, n) => ((a % n) + n) % n;
const shortDelta = (from, to) => mod(to - from + 180, 360) - 180;
const ease = {
  inOut: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
  sine:  p => -(Math.cos(Math.PI * p) - 1) / 2,
  linear: p => p,
};
// Kubische Bézier-Kurve wie in CSS: weicher Anlauf, langer, sanfter Auslauf
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  const dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return p => {
    let t = p;
    for (let i = 0; i < 6; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - p) / d; }
    return Y(Math.min(1, Math.max(0, t)));
  };
}
ease.organic = bezier(.42, 0, .18, 1);
ease.drift = bezier(.35, 0, .25, 1);

// Bewegungscharakter – hier lässt sich das „Gefühl“ zentral nachjustieren
const FEEL = {
  tempo: 1.9,         // > 1 = alles langsamer
  jitterDelay: 450,   // ms Zufallsversatz pro Zeiger
  jitterDur: .14,     // ± Anteil Zufallsstreuung der Dauer
  overshoot: 5,       // Grad, die ein Zeiger über das Ziel hinausschwingt (max.)
  maxSpeed: 140,      // °/s Höchstdrehzahl in Strömungsfeldern (bei tempo 1.9)
};
const rand = (a, b) => a + Math.random() * (b - a);

// ─── Zustand der Zeiger ───────────────────────────────────────────────────
const clocks = [];
for (let r = 0; r < ROWS; r++) {
  clocks.push([]);
  for (let c = 0; c < COLS; c++) {
    const a0 = EMBED ? Math.random() * 360 : 225, a1 = EMBED ? Math.random() * 360 : 225;
    clocks[r].push([{ a: a0, tw: null }, { a: a1, tw: null }]);
  }
}
const forEachClock = fn => { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fn(r, c, clocks[r][c]); };

function updateHands(now) {
  forEachClock((r, c, hs) => {
    hs.forEach((h, k) => {
      if (h.field) return updateField(h, r, c, k, now);
      const t = h.tw; if (!t || now < t.t0) return;
      const p = Math.min(1, (now - t.t0) / t.dur);
      const delta = t.to - t.from;
      // weiches Überschwingen kurz vor dem Ziel, das wieder zurückpendelt
      const ov = Math.min(FEEL.overshoot, Math.abs(delta) * .04) * Math.sign(delta);
      const bump = p > .62 ? Math.sin(Math.PI * (p - .62) / .38) * Math.pow(1 - p, .6) * 1.6 : 0;
      h.a = t.from + delta * t.ease(p) + ov * bump;
      if (p >= 1) { h.a = mod(t.to, 360); h.tw = null; }
    });
  });
}

// ─── Strömungsfelder ──────────────────────────────────────────────────────
// Statt von A nach B zu fahren, folgt jeder Zeiger einer Funktion fn(r, c, k, t),
// die sich stetig mit der Zeit verändert. Weiches Einblenden am Anfang, Abbremsen am Ende.
function updateField(h, r, c, k, now) {
  const f = h.field, e = now - f.t0; if (e < 0) return;
  const E = Math.min(e, f.dur), F = f.fade, D = f.dur;
  // Zeitverzerrung: in den letzten F ms läuft die Feldzeit immer langsamer bis zum Stillstand
  let tau = E;
  if (E > D - F) { const u = (E - (D - F)) / F; tau = (D - F) + F * (1 - (1 - u) * (1 - u)) / 2; }
  let val = f.fn(r, c, k, tau / 1000 * f.speed);
  if (f.off === undefined) f.off = Math.round((f.base - val) / 360) * 360;
  val += f.off;
  // Sprünge von atan2 (bzw. bei Linien-Feldern um 180°) glätten, damit kein Zeiger ruckt
  if (f.prev !== undefined) val += f.period * Math.round((f.prev - val) / f.period);
  f.prev = val;
  // Trägheit wie bei einem Schrittmotor: weiches Nachlaufen und eine Höchstdrehzahl,
  // damit Singularitäten im Feld (Pole, Zellgrenzen) nicht zu ruckartigen Sprüngen führen
  const dt = f.lastT === undefined ? 0 : Math.min(.1, (now - f.lastT) / 1000); f.lastT = now;
  if (f.cur === undefined) f.cur = val;
  else {
    const maxStep = FEEL.maxSpeed * 1.9 / FEEL.tempo * dt;
    let step = (val - f.cur) * (1 - Math.exp(-dt * 7));
    f.cur += Math.max(-maxStep, Math.min(maxStep, step));
  }
  const w = ease.organic(Math.min(1, e / f.blend));
  h.a = f.base * (1 - w) + f.cur * w;
  if (e >= D) { h.a = mod(h.a, 360); h.field = null; }
}

function flow(fn, { dur = 24000, blend = 4500, fade = 5000, delay = () => 0, speed = 1, axial = false, jitter = 300 } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => hs.forEach(h => {
    const st = now + delay(r, c) * FEEL.tempo / 1.9 + rand(0, jitter);
    h.tw = null;
    h.field = { fn, t0: st, dur, blend, fade, base: h.a, speed: speed * 1.9 / FEEL.tempo, period: axial ? 180 : 360 };
    end = Math.max(end, st + dur);
  }));
  return sleep(end - now);
}

// Klassisches 3D-Perlin-Rauschen (Ken Perlin, „Improved Noise“), Werte etwa −0,7 … 0,7
const noise = (() => {
  const p = new Uint8Array(512), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (t, a, b) => a + t * (b - a);
  const grad = (hh, x, y, z) => { const h = hh & 15, u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  return (x, y, z) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(w, lerp(v, lerp(u, grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z)), lerp(u, grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z))),
                   lerp(v, lerp(u, grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1)), lerp(u, grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1))));
  };
})();

const sleep = ms => new Promise(res => setTimeout(res, ms));

// Dauer und Startzeit pro Zeiger mit Tempo und Zufallsstreuung versehen
function timing(dur, delayMs, jitter) {
  const j = jitter ?? 1;
  const d = dur * FEEL.tempo * (1 + rand(-FEEL.jitterDur, FEEL.jitterDur) * j);
  const st = delayMs * FEEL.tempo + rand(0, FEEL.jitterDelay) * j;
  return [d, st];
}

// Zielposition anfahren. fn(r,c) → [winkel0, winkel1] oder null
function move(fn, { dur = 2000, delay = () => 0, dir = 'short', turns = 0, easing = ease.organic, jitter } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => {
    let t = fn(r, c); if (!t) return;
    let [t0, t1] = t;
    if (dir === 'short') {           // Zeiger so zuordnen, dass der Weg minimal ist
      const cost = (x, y) => Math.abs(shortDelta(hs[0].a, x)) + Math.abs(shortDelta(hs[1].a, y));
      if (cost(t1, t0) < cost(t0, t1)) [t0, t1] = [t1, t0];
    }
    [t0, t1].forEach((to, k) => {
      const h = hs[k];
      const d = typeof dir === 'function' ? dir(r, c, k) : dir;
      let delta;
      if (d === 'cw') delta = mod(to - h.a, 360) + 360 * turns;
      else if (d === 'ccw') delta = -mod(h.a - to, 360) - 360 * turns;
      else delta = shortDelta(h.a, to) + Math.sign(shortDelta(h.a, to) || 1) * 360 * turns;
      const [dd, sd] = timing(dur, delay(r, c, k), jitter);
      const st = now + sd;
      h.field = null;
      h.tw = { from: h.a, to: h.a + delta, t0: st, dur: dd, ease: easing };
      end = Math.max(end, st + dd);
    });
  });
  return sleep(end - now);
}

// Relativ drehen. fn(r,c,k) → Grad (positiv = im Uhrzeigersinn)
function spin(fn, { dur = 3000, delay = () => 0, easing = ease.drift, jitter } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => hs.forEach((h, k) => {
    const delta = fn(r, c, k); if (!delta) return;
    const [dd, sd] = timing(dur, delay(r, c, k), jitter);
    const st = now + sd;
    h.field = null;
    h.tw = { from: h.a, to: h.a + delta, t0: st, dur: dd, ease: easing };
    end = Math.max(end, st + dd);
  }));
  return sleep(end - now);
}

// ─── Ziffern als Konturschrift ────────────────────────────────────────────
// Jede Ziffer ist ein 3 × 5 Pixel-Bitmap. Ein „Pixel“ ist das Quadrat zwischen vier Uhren.
// Gezeichnet wird nur der Umriss der gefüllten Pixel – ein Umriss verzweigt sich nie,
// deshalb braucht jede Uhr genau zwei Zeiger.
const FONT = {
  0: ['111', '101', '101', '101', '111'],
  1: ['110', '010', '010', '010', '111'],
  2: ['111', '001', '111', '100', '111'],
  3: ['111', '001', '111', '001', '111'],
  4: ['101', '101', '111', '001', '001'],
  5: ['111', '100', '111', '001', '111'],
  6: ['111', '100', '111', '101', '111'],
  7: ['111', '001', '001', '001', '001'],
  8: ['111', '101', '111', '101', '111'],
  9: ['111', '101', '111', '001', '111'],
};
const PX_ROWS = ROWS - 1, PX_COLS = COLS - 1;   // 7 × 17 Pixel
const DIGIT_X = [0, 4, 10, 14];                 // Pixelspalte jeder Ziffer (symmetrisch)
const COLON = [[2, 8], [4, 8]];                 // zwei Punkte als kleine Quadrate
const BLANK = [225, 225];

const daysLeft = () => Math.max(0, Math.ceil((COUNTDOWN - new Date()) / 864e5));

function timeLayout(date = new Date()) {
  const px = Array.from({ length: PX_ROWS }, () => Array(PX_COLS).fill(0));
  const put = (d, x) => FONT[d].forEach((row, r) => [...row].forEach((v, j) => { if (v === '1') px[r + 1][x + j] = 1; }));
  if (COUNTDOWN) {
    // Countdown: Tage, mittig gesetzt (bis 4 Stellen)
    const str = String(Math.min(9999, daysLeft()));
    const x0 = Math.floor((PX_COLS - (str.length * 4 - 1)) / 2);
    [...str].forEach((d, i) => put(d, x0 + i * 4));
    return outline(px);
  }
  let h = date.getHours(); const m = date.getMinutes();
  if (settings.h12) h = h % 12 || 12;
  const str = String(h).padStart(2, '0') + String(m).padStart(2, '0');
  [...str].forEach((d, i) => put(d, DIGIT_X[i]));
  if (settings.colon) COLON.forEach(([r, c]) => px[r][c] = 1);
  return outline(px);
}

// Aus einem Pixelbild (PX_ROWS × PX_COLS) den Umriss als Zeigerstellungen berechnen
function outline(px) {
  const P = (r, c) => (r >= 0 && c >= 0 && r < PX_ROWS && c < PX_COLS) ? px[r][c] : 0;
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const tl = P(r - 1, c - 1), tr = P(r - 1, c), bl = P(r, c - 1), br = P(r, c);
      const dirs = [];
      if (tl !== tr) dirs.push(0);
      if (tr !== br) dirs.push(90);
      if (bl !== br) dirs.push(180);
      if (tl !== bl) dirs.push(270);
      grid[r].push(dirs.length >= 2 ? [dirs[0], dirs[1]] : BLANK);
    }
  }
  return grid;
}

// Uhrzeit wächst von der Mitte nach außen heraus; der zweite Zeiger folgt dem ersten etwas verzögert
const showTime = (opts = {}) => {
  const g = timeLayout();
  const done = move((r, c) => g[r][c], {
    dur: 4200, dir: 'cw',
    delay: (r, c, k) => dist(r, c) * 260 + k * 380,
    ...opts,
  });
  // Uhren, die Teil einer Ziffer sind, leuchten auf, sobald ihre Zeiger angekommen sind
  forEachClock((r, c, hs) => {
    const part = g[r][c] !== BLANK;
    hs.glowAt = part ? Math.max(...hs.map(h => h.tw ? h.tw.t0 + h.tw.dur : 0)) : null;
  });
  return done;
};
const clearGlow = () => forEachClock((r, c, hs) => { hs.glowAt = null; });

// ─── Choreografien ────────────────────────────────────────────────────────
const CR = (ROWS - 1) / 2, CC = (COLS - 1) / 2;
const dist = (r, c) => Math.hypot(r - CR, c - CC);
// Winkel, unter dem ein Zeiger von (r,c) aus zur Mitte zeigt
const toCenter = (r, c) => mod(Math.atan2(CC - c, -(CR - r)) * 180 / Math.PI, 360);

// Winkel von (r,c) zu einem Punkt bzw. eines Vektors – 0° = oben, im Uhrzeigersinn
const toward = (r, c, ty, tx) => Math.atan2(tx - c, -(ty - r)) * 180 / Math.PI;
const vecAngle = (dx, dy) => Math.atan2(dx, -dy) * 180 / Math.PI;
const TS = ms => ms * FEEL.tempo / 1.9;   // Wartezeiten mit dem Tempo mitskalieren
const blockDist = (r, c) => Math.hypot((r >> 1) - 1.5, (c >> 1) - 4);
// Ratsche: Zähler, der abwechselnd steht und weich um 1 weiterspringt
const ratchet = (t, rate) => { const u = t * rate, n = Math.floor(u), f = u - n; return n + smooth(.28, .72, f); };

const CHOREOS = {
  // ── Geometrisch ──
  // Zahnräder: je 4 Uhren (2 × 2) sind die Ecken eines Achtecks – mit 67,5° gespreizten Zeigern
  // schließt es sich fast zum Kreis. Wie ein Ratschenwerk: Kreise halten, falten sich zu Sternen,
  // drehen eine Vierteldrehung (Nachbarblöcke gegenläufig wie Zahnräder) und schließen sich wieder.
  Zahnräder: () => flow((r, c, k, t) => {
    const bR = r >> 1, bC = c >> 1;
    const th = toward(r, c, bR * 2 + .5, bC * 2 + .5);
    const sgn = (bR + bC) % 2 ? 1 : -1;
    const u = ratchet(t, .2), e = u - Math.floor(u);
    const s = 67.5 - 52 * Math.sin(Math.PI * e);
    return th + sgn * 90 * u + (k ? s : -s);
  }, { delay: (r, c) => blockDist(r, c) * 380, jitter: 60 }),

  // Ringe: 4 × 4-Blöcke – die äußeren 12 Uhren bilden einen großen Kreis, die inneren 4 einen kleinen.
  // Innen und außen drehen gegenläufig, beim Drehen verdrillen sich die Ringe zu Sternen.
  Ringe: () => flow((r, c, k, t) => {
    const cc = c - 1;
    if (cc < 0 || cc > 15) {                 // Randspalten: ruhiger Rahmen, der leicht atmet
      const a = 25 * Math.sin(t * .5 + r * .6);
      return k ? 180 - a : a;
    }
    const bR = r >> 2, bC = cc >> 2;
    const cy = bR * 4 + 1.5, cx = bC * 4 + 2.5;
    const inner = Math.abs(r - cy) < 1 && Math.abs(c - cx) < 1;
    const th = toward(r, c, cy, cx);
    const sgn = ((bR + bC) % 2 ? 1 : -1) * (inner ? -1 : 1);
    const u = ratchet(t + (inner ? .6 : 0), .17), e = u - Math.floor(u);
    const base = inner ? 67.5 : 75;          // Achteck innen, Zwölfeck außen
    const s = base - 55 * Math.sin(Math.PI * e);
    return th + sgn * (inner ? 90 : 30) * u + (k ? s : -s);
  }, { delay: (r, c) => Math.abs(c - CC) * 160, jitter: 60 }),

  // Spirale: Linien laufen zwischen Strahlenkranz, Spirale und konzentrischen Kreisen hin und her;
  // das Zentrum wandert langsam über die Platte
  Spirale: () => flow((r, c, k, t) => {
    const cy = CR + 1.1 * Math.sin(t * .14), cx = CC + 3.5 * Math.sin(t * .09);
    const d = Math.hypot(r - cy, c - cx);
    const a = toward(r, c, cy, cx) + 90 + 75 * Math.sin(t * .3) + d * 14 * Math.sin(t * .17 + 1);
    return k ? a + 180 : a;
  }, { axial: true, delay: (r, c) => dist(r, c) * 200 }),

  // Zellen: vier wandernde Keime, um jeden legen sich konzentrische Kreise; wo sich Zellen
  // begegnen, verschmelzen die Ringe weich (Orientierungen werden im doppelten Winkel gemittelt)
  Zellen: () => flow((r, c, k, t) => {
    let sx = 0, sy = 0;
    for (let i = 0; i < 4; i++) {
      const py = CR + 3.2 * Math.sin(t * (.11 + i * .03) + i * 2.9);
      const px = CC + 7.5 * Math.sin(t * (.09 + i * .025) + i * 1.7);
      const d2 = (r - py) ** 2 + (c - px) ** 2;
      const w = 1 / Math.pow(d2 + .4, 3);
      const rot = (i % 2 ? 1 : -1) * 22 * Math.sin(t * .4 + i);
      const o = (toward(r, c, py, px) + 90 + rot) * Math.PI / 90;
      sx += w * Math.cos(o); sy += w * Math.sin(o);
    }
    const a = Math.atan2(sy, sx) * 90 / Math.PI;
    return k ? a + 180 : a;
  }, { axial: true, delay: (r, c) => dist(r, c) * 150 }),

  // Inseln: geschlossene Umrisse von Inseln, die wachsen, verschmelzen und sich teilen
  Inseln: async () => {
    const z0 = Math.random() * 50;
    for (let i = 0; i < 9; i++) {
      const z = z0 + i * .3, thr = .04 + .12 * Math.sin(i * .7);
      const px = Array.from({ length: PX_ROWS }, (_, r) => Array.from({ length: PX_COLS }, (_, c) =>
        noise(c * .26, r * .3, z) + .35 * noise(c * .6 + 9, r * .6, z * 1.3) > thr ? 1 : 0));
      const g = outline(px);
      const m = move((r, c) => g[r][c], { dur: 1700, delay: (r, c) => c * 30 });
      if (i === 8) await m; else await sleep(TS(2700));
    }
  },

  // Leben: Conways „Game of Life“ – jede Generation als Umriss der lebenden Zellen
  Leben: async () => {
    const seed = () => Array.from({ length: PX_ROWS }, () => Array.from({ length: PX_COLS }, () => Math.random() < .34 ? 1 : 0));
    let b = seed();
    for (let i = 0; i < 9; i++) {
      const g = outline(b);
      const m = move((r, c) => g[r][c], { dur: 1500, delay: (r, c) => dist(r, c) * 40 });
      if (i === 8) { await m; break; }
      await sleep(TS(2600));
      const n = b.map((row, r) => row.map((v, c) => {
        let s = 0;
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (dr || dc)
          s += b[(r + dr + PX_ROWS) % PX_ROWS][(c + dc + PX_COLS) % PX_COLS];
        return s === 3 || (v && s === 2) ? 1 : 0;
      }));
      const pop = n.flat().reduce((a, v) => a + v, 0);
      b = pop < 5 || JSON.stringify(n) === JSON.stringify(b) ? seed() : n;
    }
  },

  // ── Organisch ──
  // Magnetfeld: Eisenspäne um drei wandernde Pole; die Polarität des dritten kippt langsam
  Magnetfeld: () => flow((r, c, k, t) => {
    const poles = [
      [CR + 2.6 * Math.sin(t * .23), CC + 6 * Math.sin(t * .17), 1],
      [CR + 2.6 * Math.sin(t * .19 + 2.1), CC + 6 * Math.sin(t * .13 + 3.4), -1],
      [CR + 2 * Math.cos(t * .15 + 1), CC + 5 * Math.cos(t * .21 + .7), Math.sin(t * .1)],
    ];
    let ex = 0, ey = 0;
    for (const [py, px, q] of poles) {
      const dx = c - px, dy = r - py, d2 = dx * dx + dy * dy + .35;
      ex += q * dx / d2; ey += q * dy / d2;
    }
    const a = vecAngle(ex, ey);
    return k ? a + 180 : a;
  }, { axial: true, delay: (r, c) => c * 110 }),

  // Moiré: ein Zeiger kreist um Zentrum A, der andere gegenläufig um Zentrum B –
  // zwei überlagerte Wirbel erzeugen Interferenzmuster
  Moiré: () => flow((r, c, k, t) => {
    const ay = CR + 2.2 * Math.sin(t * .21), ax = CC - 4 + 3 * Math.sin(t * .16);
    const by = CR + 2.2 * Math.cos(t * .18), bx = CC + 4 + 3 * Math.cos(t * .14 + 1);
    const wob = 25 * Math.sin(t * .3);
    return k ? toward(r, c, by, bx) - 90 + wob : toward(r, c, ay, ax) + 90 - wob;
  }, { delay: (r, c) => dist(r, c) * 160 }),

  // Vogelschwarm: ein driftendes Strömungsfeld; die Zeigerpaare öffnen und schließen sich wie Flügel
  Schwarm: () => flow((r, c, k, t) => {
    const x = c * .15, y = r * .15;
    const dir = noise(x + t * .07, y - t * .05, t * .045) * 560 + t * 18;
    const wing = 95 + 125 * noise(x * .7 + 31, y * .7 + 7, t * .09);
    return k ? dir + wing / 2 : dir - wing / 2;
  }, { delay: (r, c) => c * 120 }),

  // Kaleidoskop: ein Quadrant wird berechnet und an beiden Achsen gespiegelt
  Kaleidoskop: () => flow((r, c, k, t) => {
    let x = c - CC, y = r - CR;
    const mx = x < 0, my = y < 0; x = Math.abs(x); y = Math.abs(y);
    const d = Math.hypot(x, y);
    const a = noise(x * .21 - t * .05, y * .21 + t * .04, t * .06) * 480
            + Math.sin(d * .7 - t * .5) * 55 + t * 16;
    const s = 92 + 78 * Math.sin(t * .32 + d * .42);
    let ang = k ? a + s : a - s;
    if (mx) ang = -ang;
    if (my) ang = 180 - ang;
    return ang;
  }, { delay: (r, c) => dist(r, c) * 180 }),

  // Strömung: zwei wandernde Wellenquellen überlagern sich; Zeigerpaare bilden durchgehende Linien
  Strömung: () => flow((r, c, k, t) => {
    const p1x = CC + 6.5 * Math.sin(t * .17), p1y = CR + 3 * Math.cos(t * .13);
    const p2x = CC + 6.5 * Math.cos(t * .15 + 1), p2y = CR + 3 * Math.sin(t * .19 + 2);
    const d1 = Math.hypot(c - p1x, r - p1y), d2 = Math.hypot(c - p2x, r - p2y);
    const a = (Math.sin(d1 * .6 - t * .62) + Math.sin(d2 * .6 - t * .5)) * 62 + t * 7;
    return k ? a + 180 : a;
  }, { delay: (r, c) => (COLS - c) * 100 }),

  // Atem: Blütenblätter öffnen und schließen sich in Wellen von der Mitte nach außen
  Atem: () => flow((r, c, k, t) => {
    const d = dist(r, c), b = toCenter(r, c);
    const s = 92 - 86 * Math.cos(t * .8 - d * .55);
    return (k ? b + s : b - s) + Math.sin(t * .3) * 25;
  }, { delay: (r, c) => dist(r, c) * 220 }),

  // Uhrwerk: alle Uhren zeigen kurz als echte Analoguhren die Uhrzeit (Stundenzeiger schrumpft),
  // dann wird eine Stunde in einer Welle vorgespult und wieder zurück
  Uhrwerk: async () => {
    const d = new Date();
    const H = (d.getHours() % 12 + d.getMinutes() / 60) * 30, M = d.getMinutes() * 6 + d.getSeconds() * .1;
    animLen(.58, 3500);
    await move(() => [H, M], { dur: 3800, dir: 'cw', delay: (r, c) => dist(r, c) * 200 });
    await sleep(2500);
    await spin((r, c, k) => k ? 360 : 30, { dur: 4500, delay: (r, c) => c * 160 });
    await spin((r, c, k) => k ? -360 : -30, { dur: 4500, delay: (r, c) => (COLS - c) * 160 });
    animLen(1, 3500);
  },
  Welle: async () => {
    await move(() => [0, 180], { dur: 1800, delay: (r, c) => c * 50 });
    await spin(() => 720, { dur: 4500, delay: (r, c) => c * 140 });
    await spin((r, c, k) => k ? -540 : 540, { dur: 4000, delay: (r) => r * 160 });
  },
  Wirbel: async () => {
    await move((r, c) => { const t = toCenter(r, c) + 90; return [t, t + 180]; }, { dur: 2200 });
    await spin(() => 720, { dur: 6000, delay: (r, c) => dist(r, c) * 180 });
    await move((r, c) => { const t = toCenter(r, c); return [t, t + 180]; }, { dur: 2500, delay: (r, c) => dist(r, c) * 120 });
  },
  Diagonalen: async () => {
    await move(() => [45, 225], { dur: 2000, delay: (r, c) => (r + c) * 40 });
    for (let i = 0; i < 4; i++) {
      await spin((r, c) => ((r + c) % 2 ? 90 : -90), { dur: 1600 });
      await sleep(250);
    }
  },
  Blüte: async () => {
    await move((r, c) => { const t = toCenter(r, c); return [t, t]; }, { dur: 2200 });
    await spin((r, c, k) => k ? -720 : 720, { dur: 6500, delay: (r, c) => dist(r, c) * 220 });
  },
  Schere: async () => {
    await move(() => [0, 0], { dur: 2000, delay: (r, c) => r * 60 });
    await spin(() => 1080, { dur: 7000, delay: (r, c, k) => r * 90 + c * 40 + k * 700 });
  },
};
const PROGRAMS = {
  alle:        ['Schwarm', 'Zahnräder', 'Welle', 'Magnetfeld', 'Inseln', 'Kaleidoskop', 'Ringe', 'Uhrwerk', 'Spirale', 'Strömung', 'Leben', 'Wirbel', 'Moiré', 'Zellen', 'Atem', 'Diagonalen', 'Blüte', 'Schere'],
  geometrisch: ['Zahnräder', 'Inseln', 'Ringe', 'Spirale', 'Leben', 'Zellen'],
  organisch:   ['Schwarm', 'Magnetfeld', 'Kaleidoskop', 'Moiré', 'Strömung', 'Atem'],
  klassisch:   ['Welle', 'Uhrwerk', 'Wirbel', 'Blüte', 'Schere', 'Diagonalen'],
};
const PROGRAM_LABELS = { alle: 'Alle', geometrisch: 'Geometrisch', organisch: 'Organisch', klassisch: 'Klassisch' };
const CHOREO_NAMES = PROGRAMS.alle;

// ─── Ablauf ───────────────────────────────────────────────────────────────
const settings = { mode: 'aktiv', theme: 'white', h12: false, colon: true, program: 'alle' };
let forced = null, choreoIdx = 0;
const statusEl = document.getElementById('status');

async function waitUntil(pred) { while (!pred() && !forced) await sleep(100); }

async function run() {
  await showTime({ dur: 3500 });
  while (true) {
    const sec = () => new Date().getSeconds();
    if (settings.mode === 'aktiv') await waitUntil(() => sec() >= 27);
    else if (settings.mode === 'demo') { const t = Date.now() + (EMBED ? HOLD : 5000); await waitUntil(() => Date.now() > t); }
    else { const m = new Date().getMinutes(); await waitUntil(() => new Date().getMinutes() !== m); }

    if (settings.mode !== 'minimal' || forced) {
      const list = PROGRAMS[settings.program] || CHOREO_NAMES;
      const name = forced || list[choreoIdx++ % list.length];
      forced = null;
      statusEl.textContent = name;
      clearGlow();
      await CHOREOS[name]();
      statusEl.textContent = '';
      if (settings.mode === 'aktiv') await waitUntil(() => sec() < 30); // bis zur neuen Minute
    }
    await showTime();
  }
}

// Länge des „Stundenzeigers“ (Zeiger 0) – nur in der Choreografie „Uhrwerk“ ≠ 1
let hourLen = 1, lenTw = null;
function animLen(to, dur) { lenTw = { from: hourLen, to, t0: performance.now(), dur: dur * FEEL.tempo / 1.9 }; }
function updateLen(now) {
  if (!lenTw) return;
  const p = Math.min(1, (now - lenTw.t0) / lenTw.dur);
  hourLen = lenTw.from + (lenTw.to - lenTw.from) * ease.organic(p);
  if (p >= 1) lenTw = null;
}

const theme = () => THEMES[settings.theme] || THEMES.white;

// ─── Prozedurale Texturen ─────────────────────────────────────────────────
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
function ramp(stops, t) {
  t = clamp01(t) * (stops.length - 1); const i = Math.min(stops.length - 2, Math.floor(t));
  return mix(stops[i], stops[i + 1], t - i);
}
function fbm(x, y, z, oct) {
  let s = 0, a = .5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f, z + i * 7.3); a *= .5; f *= 2.03; }
  return s;
}

const MATERIAL = {
  wood(u, v, T) {
    const R = T._ramp || (T._ramp = T.ramp.map(hex));
    const warp = fbm(u * .09, v * .45, 1.3, 3);
    const ring = v * 1.35 + warp * 4.2 + fbm(u * .025, v * .08, 7.1, 2) * 5;
    const figure = .5 + .5 * Math.sin(ring * Math.PI * 2);
    const streak = .5 + fbm(u * .7, v * 16, 3.3, 3) * 1.1;
    const pore = noise(u * 9, v * 60, 5.5) > .38 ? -.12 : 0;
    return ramp(R, Math.pow(figure, .8) * .55 + streak * .45 + pore);
  },
  marble(u, v, T) {
    const base = T._b || (T._b = hex(T.base)), cloud = T._c || (T._c = hex(T.cloud)), vein = T._v || (T._v = hex(T.vein));
    let col = mix(base, cloud, smooth(.3, .75, .5 + fbm(u * .22, v * .22, 2.1, 4)));
    // Hauptadern: ruhig geschwungen (wenige Oktaven), mit weichem Hof
    const tv = u * .16 + v * .24 + fbm(u * .13, v * .13, 5.5, 3) * 3.2;
    const vv = 1 - Math.abs(Math.sin(tv * Math.PI));
    // feine Nebenadern, nur stellenweise sichtbar
    const tv2 = u * .45 - v * .2 + fbm(u * .22, v * .22, 9.9, 3) * 2.6;
    const vv2 = (1 - Math.abs(Math.sin(tv2 * Math.PI))) * smooth(.05, .35, fbm(u * .15, v * .15, 4.4, 2) + .2);
    const amt = Math.pow(vv, 30) * .95 + Math.pow(vv, 7) * .22 + Math.pow(vv2, 60) * .5;
    return mix(col, vein, clamp01(amt));
  },
  rust(u, v) {
    const R = MATERIAL._rust || (MATERIAL._rust = ['#26100a', '#4e1f0e', '#7c3414', '#a24c1c', '#bf6a30', '#d38d50'].map(hex));
    const n = .5 + fbm(u * .4, v * .4, 3.7, 5);
    const d = .5 + fbm(u * 2.4, v * 2.4, 8.1, 3);
    const streak = fbm(u * 1.4, v * .07, 4.4, 2);
    let t = n * .62 + d * .3 + streak * .5 - .02;
    if (noise(u * 11, v * 11, 2.2) > .45) t -= .25;
    return ramp(R, t);
  },
  copper(u, v) {
    const R = MATERIAL._cu || (MATERIAL._cu = ['#3e1a0b', '#7a3a1c', '#b5633a', '#de9467', '#f6c7a0'].map(hex));
    const brush = fbm(u * .12, v * 30, 1.1, 2) * .3;
    const sheen = .5 + .5 * Math.sin((u * .16 - v * .32) * 2.2 + fbm(u * .18, v * .18, 2.2, 2) * 2.5);
    return ramp(R, .3 + sheen * .5 + brush);
  },
  verdigris(u, v) {
    const CU = MATERIAL._cu2 || (MATERIAL._cu2 = ['#3a170a', '#6e3216', '#9a5328', '#b86e3c'].map(hex));
    const PT = MATERIAL._pt || (MATERIAL._pt = ['#1f5a50', '#3c8a78', '#6cb7a1', '#a3d8c6'].map(hex));
    const cu = ramp(CU, .45 + fbm(u * .12, v * 20, 1.2, 2) * .8 + fbm(u * .5, v * .5, 3.1, 3) * .6);
    const n = .5 + fbm(u * .95, v * .95, 6.6, 5) + fbm(u * 4, v * 4, 1.9, 2) * .3;
    const p = smooth(.42, .6, n);
    const pt = ramp(PT, .5 + fbm(u * 1.1, v * 1.1, 4.2, 3) * 1.2);
    let col = mix(cu, pt, p);
    const drip = fbm(u * 1.8, v * .06, 8.8, 2);
    if (drip > .18) col = mix(col, PT[1], clamp01((drip - .18) * 2.5) * .5);
    return col;
  },
  concrete(u, v, T) {
    const tone = T.tone || [168, 167, 163];
    const n = fbm(u * .7, v * .7, 1.7, 5) * .28 + fbm(u * 5, v * 5, 2.9, 2) * .12;
    let k = 1 + n;
    if (noise(u * 16, v * 16, 3.3) > .43) k -= .22;
    if (noise(u * 40, v * 40, 6.1) > .5) k -= .1;
    return [tone[0] * k, tone[1] * k, tone[2] * k];
  },
};

const texCache = {};
function texture(key, W, H) {
  const id = key + W + 'x' + H; if (texCache[id]) return texCache[id];
  const T = THEMES[key], c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H), px = img.data, fn = MATERIAL[T.tex];
  const scale = PANEL_W / W;          // Koordinaten in Uhrenabständen → Maserung unabhängig von der Auflösung
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
    const col = fn(x * scale, y * scale, T);
    px[i] = col[0]; px[i + 1] = col[1]; px[i + 2] = col[2]; px[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return texCache[id] = c;
}

// ─── Zeichnen ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let geo = {}, bg = null, activeSprite = null;

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const maxW = innerWidth * (EMBED ? 1 : .94), maxH = innerHeight * (EMBED ? 1 : .9);
  const w = Math.min(maxW, maxH * PANEL_W / PANEL_H), h = w * PANEL_H / PANEL_W;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pitch = Math.min(w / (COLS + .6), h / (ROWS + .6));
  geo = { w, h, dpr, pitch, ox: (w - pitch * COLS) / 2 + pitch / 2, oy: (h - pitch * ROWS) / 2 + pitch / 2, R: pitch * .44 };
  buildBackground();
}

// Platte und alle Zifferblätter sind statisch → einmal in ein Hintergrundbild rendern
function buildBackground() {
  const T = theme(), { w, h, dpr, R, pitch, ox, oy } = geo; if (!R) return;
  const c = document.createElement('canvas'); c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr);

  if (T.tex) {
    const TW = Math.max(300, Math.min(1100, Math.round(w * dpr * .6)));
    g.imageSmoothingQuality = 'high';
    g.drawImage(texture(settings.theme, TW, Math.round(TW * h / w)), 0, 0, w, h);
    // feine Fase an der Plattenkante
    g.lineWidth = 2; g.strokeStyle = T.light; g.strokeRect(1, 1, w - 2, h - 2);
  } else { g.fillStyle = T.panel; g.fillRect(0, 0, w, h); }

  forEachClock((r, cc) => drawFace(g, ox + cc * pitch, oy + r * pitch, R, T));
  bg = c;

  activeSprite = null;
  if (T.face.active) {
    const S = Math.ceil(R * 2.6), a = document.createElement('canvas');
    a.width = S * dpr; a.height = S * dpr;
    const ag = a.getContext('2d'); ag.scale(dpr, dpr);
    ag.beginPath(); ag.arc(S / 2, S / 2, R, 0, Math.PI * 2);
    ag.fillStyle = T.face.active; ag.fill();
    ag.lineWidth = Math.max(1.5, R * .09); ag.strokeStyle = T.shade; ag.stroke();
    activeSprite = { img: a, S };
  }
}

function drawFace(g, x, y, R, T) {
  const F = T.face, circle = (rad = R, cx = x, cy = y) => { g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); };
  if (F.type === 'neo') {
    const o = R * .14;
    circle(R, x + o, y + o); g.fillStyle = T.shade; g.fill();
    circle(); g.fillStyle = F.fill; g.fill();
    g.lineWidth = Math.max(1.5, R * .09); g.strokeStyle = T.shade; g.stroke();
    return;
  }
  if (F.type === 'raised') {
    // erhabene Scheibe: Schlagschatten nach unten rechts, Wölbung durch Verlauf
    g.save(); circle();
    g.shadowColor = T.shade; g.shadowBlur = R * .45; g.shadowOffsetX = R * .12 * geo.dpr; g.shadowOffsetY = R * .2 * geo.dpr;
    const lg = g.createLinearGradient(x - R, y - R, x + R, y + R);
    lg.addColorStop(0, F.fill); lg.addColorStop(1, F.fill2);
    g.fillStyle = lg; g.fill(); g.restore();
    const rg = g.createRadialGradient(x - R * .35, y - R * .4, 0, x - R * .2, y - R * .2, R * 1.1);
    rg.addColorStop(0, T.light); rg.addColorStop(.55, 'rgba(255,255,255,0)');
    circle(); g.fillStyle = rg; g.fill();
    return;
  }
  // 'recess': eingefräste Mulde, Licht von oben links
  if (F.fill) {
    const rg = g.createRadialGradient(x + R * .25, y + R * .3, R * .1, x, y, R * 1.05);
    rg.addColorStop(0, F.fill); rg.addColorStop(1, T.panel);
    circle(); g.fillStyle = rg; g.fill();
  } else { circle(); g.fillStyle = F.tint; g.fill(); }
  g.save(); circle(); g.clip();
  g.beginPath(); g.rect(x - R * 3, y - R * 3, R * 6, R * 6); g.arc(x, y, R, 0, Math.PI * 2, true);
  g.shadowColor = T.shade; g.shadowBlur = R * .35;
  g.shadowOffsetX = R * .1 * geo.dpr; g.shadowOffsetY = R * .16 * geo.dpr;
  g.fillStyle = '#000'; g.fill();
  g.restore();
  const lg = g.createLinearGradient(x - R, y - R, x + R, y + R);
  lg.addColorStop(0, T.shade); lg.addColorStop(.45, 'rgba(0,0,0,0)');
  lg.addColorStop(.6, 'rgba(0,0,0,0)'); lg.addColorStop(1, T.light);
  circle(R - .5); g.lineWidth = Math.max(1, R * .045); g.strokeStyle = lg; g.stroke();
}

let lastNow = performance.now();
function draw(now) {
  const T = theme(), H = T.hand, { w, h, pitch, ox, oy, R } = geo;
  const dt = Math.min(.1, (now - lastNow) / 1000); lastNow = now;
  if (bg) ctx.drawImage(bg, 0, 0, w, h);
  const L = R * .93, lw = Math.max(1.5, R * .13 * (H.w || 1));
  const sx = R * .07, sy = R * .11;
  ctx.lineCap = H.cap || 'round';
  const handPath = (x, y, hs, dx = 0, dy = 0, shrink = 1) => {
    ctx.beginPath();
    hs.forEach((hd, k) => {
      const a = hd.a * Math.PI / 180, l = L * (k === 0 ? hourLen : 1) * shrink;
      ctx.moveTo(x + dx, y + dy); ctx.lineTo(x + dx + Math.sin(a) * l, y + dy - Math.cos(a) * l);
    });
  };
  forEachClock((r, c, hs) => {
    const x = ox + c * pitch, y = oy + r * pitch;
    // aufleuchtende Ziffern (nur Materialien mit face.active)
    const target = hs.glowAt != null && now >= hs.glowAt ? 1 : 0;
    hs.glow = (hs.glow || 0) + (target - (hs.glow || 0)) * Math.min(1, dt * 2.2);
    if (activeSprite && hs.glow > .01) {
      ctx.globalAlpha = hs.glow;
      ctx.drawImage(activeSprite.img, x - activeSprite.S / 2, y - activeSprite.S / 2, activeSprite.S, activeSprite.S);
      ctx.globalAlpha = 1;
    }
    if (T.handShadow) {
      ctx.strokeStyle = T.handShadow;
      ctx.lineWidth = lw * 3.0; handPath(x, y, hs, sx * 1.4, sy * 1.4); ctx.stroke();
      ctx.lineWidth = lw * 1.9; handPath(x, y, hs, sx * 1.1, sy * 1.1); ctx.stroke();
      ctx.lineWidth = lw * 1.1; handPath(x, y, hs, sx * .8, sy * .8); ctx.stroke();
    }
    ctx.strokeStyle = H.c; ctx.lineWidth = lw; handPath(x, y, hs); ctx.stroke();
    if (H.hl) {   // Glanzlinie auf Metallzeigern
      ctx.strokeStyle = H.hl; ctx.globalAlpha = .75; ctx.lineWidth = lw * .32;
      handPath(x, y, hs, -lw * .18, -lw * .18, .92); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(x, y, lw * .6, 0, Math.PI * 2); ctx.fillStyle = H.c; ctx.fill();
    if (H.hl) { ctx.beginPath(); ctx.arc(x - lw * .15, y - lw * .15, lw * .22, 0, Math.PI * 2); ctx.fillStyle = H.hl; ctx.fill(); }
  });
}

function frame(now) { updateHands(now); updateLen(now); draw(now); requestAnimationFrame(frame); }

// ─── Bedienleiste ─────────────────────────────────────────────────────────
const ui = document.getElementById('ui');
function btn(label, onClick, isOn) {
  const b = document.createElement('button'); b.textContent = label;
  b.onclick = () => { onClick(); renderUI(); }; if (isOn && isOn()) b.classList.add('on');
  ui.appendChild(b);
}
const sep = () => { const s = document.createElement('div'); s.className = 'sep'; ui.appendChild(s); };
function renderUI() {
  ui.innerHTML = '';
  for (const m of ['aktiv', 'demo', 'minimal']) btn(m[0].toUpperCase() + m.slice(1), () => { settings.mode = m; save(); }, () => settings.mode === m);
  sep();
  // Programm: welche Gruppe von Choreografien im Aktiv-/Demo-Modus läuft
  const prog = document.createElement('select'); prog.title = 'Programm';
  for (const [k, l] of Object.entries(PROGRAM_LABELS)) {
    const o = document.createElement('option'); o.value = k; o.textContent = 'Programm: ' + l;
    if (k === settings.program) o.selected = true; prog.appendChild(o);
  }
  prog.onchange = () => { settings.program = prog.value; choreoIdx = 0; save(); };
  ui.appendChild(prog);
  // einzelne Choreografie sofort abspielen
  const play = document.createElement('select'); play.title = 'Choreografie abspielen';
  const ph = document.createElement('option'); ph.textContent = '▶ Abspielen …'; ph.value = ''; play.appendChild(ph);
  for (const k of ['geometrisch', 'organisch', 'klassisch']) {
    const og = document.createElement('optgroup'); og.label = PROGRAM_LABELS[k];
    for (const n of PROGRAMS[k]) { if (k === 'klassisch' && n === 'Diagonalen') continue; const o = document.createElement('option'); o.value = n; o.textContent = n; og.appendChild(o); }
    play.appendChild(og);
  }
  play.onchange = () => { if (play.value) forced = play.value; play.value = ''; };
  ui.appendChild(play);
  sep();
  const sel = document.createElement('select'); sel.title = 'Material';
  for (const [k, t] of Object.entries(THEMES)) {
    const o = document.createElement('option'); o.value = k; o.textContent = t.label;
    if (k === settings.theme) o.selected = true; sel.appendChild(o);
  }
  sel.onchange = () => { settings.theme = sel.value; applyTheme(); save(); renderUI(); };
  ui.appendChild(sel);
  btn(settings.h12 ? '24h' : '12h', () => { settings.h12 = !settings.h12; save(); });
  btn(settings.colon ? 'Ohne :' : 'Mit :', () => { settings.colon = !settings.colon; save(); });
  btn('Vollbild', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
}
function applyTheme() {
  if (!THEMES[settings.theme]) settings.theme = 'white';
  const T = theme(), root = document.documentElement;
  root.dataset.ui = T.ui; root.dataset.theme = settings.theme;
  root.style.setProperty('--wall', T.wall);
  if (T.ui !== 'neo') {
    root.style.setProperty('--accent', T.hand.c);
    root.style.setProperty('--accent-fg', T.ui === 'dark' ? '#111' : '#fff');
  } else { root.style.removeProperty('--accent'); root.style.removeProperty('--accent-fg'); }
  buildBackground();
}
function save() { try { localStorage.setItem('onetwenty', JSON.stringify(settings)); } catch (e) {} }
if (!EMBED) { try { Object.assign(settings, JSON.parse(localStorage.getItem('onetwenty') || '{}')); } catch (e) {} }
else settings.mode = 'demo';
const q = new URLSearchParams(location.search);
if (q.get('mode')) settings.mode = q.get('mode');
if (q.get('theme')) settings.theme = q.get('theme');
if (q.get('program') && PROGRAMS[q.get('program')]) settings.program = q.get('program');

// Bedienleiste ausblenden, wenn die Maus ruht
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); };
['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake));

let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });
applyTheme(); resize(); renderUI(); wake();
requestAnimationFrame(frame);
run();
</script>
</body>
</html>
