<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onetwenty</title>
<meta name="description" content="120 analoge Uhren, choreografiert – eine digitale Hommage an kinetische Uhrenkunst.">
<style>
  :root {
    --wall: #d9d6cf;
    --panel: #ecebe6;
    --face: #f4f3ef;
    --face-edge: rgba(0,0,0,.10);
    --hand: #161616;
    --shade: rgba(60,50,35,.34);
    --light: rgba(255,255,255,.95);
    --hand-shadow: rgba(40,30,20,.10);
    --ui-bg: rgba(255,255,255,.75);
    --ui-fg: #222;
  }
  :root[data-theme="black"] {
    --wall: #2a2a2a;
    --panel: #141414;
    --face: #262626;
    --face-edge: rgba(255,255,255,.06);
    --hand: #f1f1f1;
    --shade: rgba(0,0,0,.85);
    --light: rgba(255,255,255,.20);
    --hand-shadow: rgba(0,0,0,.55);
    --ui-bg: rgba(20,20,20,.75);
    --ui-fg: #eee;
  }
  :root[data-theme="neo"] {
    --wall: #ffd23f;
    --panel: #8f5cf6;
    --face: #ffd23f;
    --hand: #111111;
    --shade: #111111;
    --light: #ffffff;
    --hand-shadow: transparent;
    --ui-bg: #ffffff;
    --ui-fg: #111111;
  }
  :root[data-theme="neo"] canvas {
    outline: 5px solid #111; border-radius: 4px;
    box-shadow: 14px 14px 0 #111;
  }
  :root[data-theme="neo"] #ui {
    border: 3px solid #111; border-radius: 6px; box-shadow: 6px 6px 0 #111;
    backdrop-filter: none; font-weight: 700;
  }
  :root[data-theme="neo"] #ui button {
    background: #fff; border: 2.5px solid #111; border-radius: 4px;
    box-shadow: 3px 3px 0 #111; opacity: 1; font-weight: 700;
    transition: transform .08s, box-shadow .08s;
  }
  :root[data-theme="neo"] #ui button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #111; }
  :root[data-theme="neo"] #ui button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #111; }
  :root[data-theme="neo"] #ui button.on { background: #8f5cf6; color: #fff; border-color: #111; }
  :root[data-theme="neo"] #ui .sep { opacity: 1; width: 3px; }
  :root[data-theme="neo"] #status { font-weight: 800; opacity: 1; text-transform: uppercase; letter-spacing: .08em; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--wall);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ui-fg);
    overflow: hidden;
    display: grid;
    place-items: center;
    transition: background .6s;
  }
  canvas { display: block; }
  #ui {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: calc(100vw - 32px);
    padding: 8px; border-radius: 12px;
    background: var(--ui-bg); backdrop-filter: blur(8px);
    transition: opacity .5s;
  }
  body.idle #ui { opacity: 0; pointer-events: none; }
  #ui button {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid currentColor; border-radius: 8px;
    padding: 5px 10px; cursor: pointer; opacity: .75;
  }
  #ui button:hover { opacity: 1; }
  #ui button.on { opacity: 1; background: var(--hand); color: var(--panel); border-color: var(--hand); }
  #ui .sep { width: 1px; background: currentColor; opacity: .25; margin: 2px 4px; }
  #status { position: fixed; top: 12px; left: 16px; font-size: 12px; opacity: .55; }
  body.idle #status { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="ui"></div>

<script>
// ─── Grundgrößen ──────────────────────────────────────────────────────────
const ROWS = 8, COLS = 18;               // 8 × 18 = 144 Uhren
const PANEL_W = COLS + .8, PANEL_H = ROWS + .8;  // Seitenverhältnis folgt dem Raster

// Winkel in Grad: 0 = 12 Uhr, im Uhrzeigersinn
const mod = (a, n) => ((a % n) + n) % n;
const shortDelta = (from, to) => mod(to - from + 180, 360) - 180;
const ease = {
  inOut: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
  sine:  p => -(Math.cos(Math.PI * p) - 1) / 2,
  linear: p => p,
};
// Kubische Bézier-Kurve wie in CSS: weicher Anlauf, langer, sanfter Auslauf
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  const dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return p => {
    let t = p;
    for (let i = 0; i < 6; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - p) / d; }
    return Y(Math.min(1, Math.max(0, t)));
  };
}
ease.organic = bezier(.42, 0, .18, 1);
ease.drift = bezier(.35, 0, .25, 1);

// Bewegungscharakter – hier lässt sich das „Gefühl“ zentral nachjustieren
const FEEL = {
  tempo: 1.9,         // > 1 = alles langsamer
  jitterDelay: 450,   // ms Zufallsversatz pro Zeiger
  jitterDur: .14,     // ± Anteil Zufallsstreuung der Dauer
  overshoot: 5,       // Grad, die ein Zeiger über das Ziel hinausschwingt (max.)
};
const rand = (a, b) => a + Math.random() * (b - a);

// ─── Zustand der Zeiger ───────────────────────────────────────────────────
const clocks = [];
for (let r = 0; r < ROWS; r++) {
  clocks.push([]);
  for (let c = 0; c < COLS; c++) clocks[r].push([{ a: 225, tw: null }, { a: 225, tw: null }]);
}
const forEachClock = fn => { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fn(r, c, clocks[r][c]); };

function updateHands(now) {
  forEachClock((r, c, hs) => {
    hs.forEach((h, k) => {
      if (h.field) return updateField(h, r, c, k, now);
      const t = h.tw; if (!t || now < t.t0) return;
      const p = Math.min(1, (now - t.t0) / t.dur);
      const delta = t.to - t.from;
      // weiches Überschwingen kurz vor dem Ziel, das wieder zurückpendelt
      const ov = Math.min(FEEL.overshoot, Math.abs(delta) * .04) * Math.sign(delta);
      const bump = p > .62 ? Math.sin(Math.PI * (p - .62) / .38) * Math.pow(1 - p, .6) * 1.6 : 0;
      h.a = t.from + delta * t.ease(p) + ov * bump;
      if (p >= 1) { h.a = mod(t.to, 360); h.tw = null; }
    });
  });
}

// ─── Strömungsfelder ──────────────────────────────────────────────────────
// Statt von A nach B zu fahren, folgt jeder Zeiger einer Funktion fn(r, c, k, t),
// die sich stetig mit der Zeit verändert. Weiches Einblenden am Anfang, Abbremsen am Ende.
function updateField(h, r, c, k, now) {
  const f = h.field, e = now - f.t0; if (e < 0) return;
  const E = Math.min(e, f.dur), F = f.fade, D = f.dur;
  // Zeitverzerrung: in den letzten F ms läuft die Feldzeit immer langsamer bis zum Stillstand
  let tau = E;
  if (E > D - F) { const u = (E - (D - F)) / F; tau = (D - F) + F * (1 - (1 - u) * (1 - u)) / 2; }
  const val = f.fn(r, c, k, tau / 1000 * f.speed);
  if (f.off === undefined) f.off = Math.round((f.base - val) / 360) * 360;
  const w = ease.organic(Math.min(1, e / f.blend));
  h.a = f.base * (1 - w) + (val + f.off) * w;
  if (e >= D) { h.a = mod(h.a, 360); h.field = null; }
}

function flow(fn, { dur = 24000, blend = 4500, fade = 5000, delay = () => 0, speed = 1 } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => hs.forEach(h => {
    const st = now + delay(r, c) * FEEL.tempo / 1.9 + rand(0, 300);
    h.tw = null;
    h.field = { fn, t0: st, dur, blend, fade, base: h.a, speed: speed * 1.9 / FEEL.tempo };
    end = Math.max(end, st + dur);
  }));
  return sleep(end - now);
}

// Klassisches 3D-Perlin-Rauschen (Ken Perlin, „Improved Noise“), Werte etwa −0,7 … 0,7
const noise = (() => {
  const p = new Uint8Array(512), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (t, a, b) => a + t * (b - a);
  const grad = (hh, x, y, z) => { const h = hh & 15, u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
  return (x, y, z) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    const u = fade(x), v = fade(y), w = fade(z);
    const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
    return lerp(w, lerp(v, lerp(u, grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z)), lerp(u, grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z))),
                   lerp(v, lerp(u, grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1)), lerp(u, grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1))));
  };
})();

const sleep = ms => new Promise(res => setTimeout(res, ms));

// Dauer und Startzeit pro Zeiger mit Tempo und Zufallsstreuung versehen
function timing(dur, delayMs, jitter) {
  const j = jitter ?? 1;
  const d = dur * FEEL.tempo * (1 + rand(-FEEL.jitterDur, FEEL.jitterDur) * j);
  const st = delayMs * FEEL.tempo + rand(0, FEEL.jitterDelay) * j;
  return [d, st];
}

// Zielposition anfahren. fn(r,c) → [winkel0, winkel1] oder null
function move(fn, { dur = 2000, delay = () => 0, dir = 'short', turns = 0, easing = ease.organic, jitter } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => {
    let t = fn(r, c); if (!t) return;
    let [t0, t1] = t;
    if (dir === 'short') {           // Zeiger so zuordnen, dass der Weg minimal ist
      const cost = (x, y) => Math.abs(shortDelta(hs[0].a, x)) + Math.abs(shortDelta(hs[1].a, y));
      if (cost(t1, t0) < cost(t0, t1)) [t0, t1] = [t1, t0];
    }
    [t0, t1].forEach((to, k) => {
      const h = hs[k];
      const d = typeof dir === 'function' ? dir(r, c, k) : dir;
      let delta;
      if (d === 'cw') delta = mod(to - h.a, 360) + 360 * turns;
      else if (d === 'ccw') delta = -mod(h.a - to, 360) - 360 * turns;
      else delta = shortDelta(h.a, to) + Math.sign(shortDelta(h.a, to) || 1) * 360 * turns;
      const [dd, sd] = timing(dur, delay(r, c, k), jitter);
      const st = now + sd;
      h.field = null;
      h.tw = { from: h.a, to: h.a + delta, t0: st, dur: dd, ease: easing };
      end = Math.max(end, st + dd);
    });
  });
  return sleep(end - now);
}

// Relativ drehen. fn(r,c,k) → Grad (positiv = im Uhrzeigersinn)
function spin(fn, { dur = 3000, delay = () => 0, easing = ease.drift, jitter } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => hs.forEach((h, k) => {
    const delta = fn(r, c, k); if (!delta) return;
    const [dd, sd] = timing(dur, delay(r, c, k), jitter);
    const st = now + sd;
    h.field = null;
    h.tw = { from: h.a, to: h.a + delta, t0: st, dur: dd, ease: easing };
    end = Math.max(end, st + dd);
  }));
  return sleep(end - now);
}

// ─── Ziffern als Konturschrift ────────────────────────────────────────────
// Jede Ziffer ist ein 3 × 5 Pixel-Bitmap. Ein „Pixel“ ist das Quadrat zwischen vier Uhren.
// Gezeichnet wird nur der Umriss der gefüllten Pixel – ein Umriss verzweigt sich nie,
// deshalb braucht jede Uhr genau zwei Zeiger.
const FONT = {
  0: ['111', '101', '101', '101', '111'],
  1: ['110', '010', '010', '010', '111'],
  2: ['111', '001', '111', '100', '111'],
  3: ['111', '001', '111', '001', '111'],
  4: ['101', '101', '111', '001', '001'],
  5: ['111', '100', '111', '001', '111'],
  6: ['111', '100', '111', '101', '111'],
  7: ['111', '001', '001', '001', '001'],
  8: ['111', '101', '111', '101', '111'],
  9: ['111', '101', '111', '001', '111'],
};
const PX_ROWS = ROWS - 1, PX_COLS = COLS - 1;   // 7 × 17 Pixel
const DIGIT_X = [0, 4, 10, 14];                 // Pixelspalte jeder Ziffer (symmetrisch)
const COLON = [[2, 8], [4, 8]];                 // zwei Punkte als kleine Quadrate
const BLANK = [225, 225];

function timeLayout(date = new Date()) {
  let h = date.getHours(); const m = date.getMinutes();
  if (settings.h12) h = h % 12 || 12;
  const str = String(h).padStart(2, '0') + String(m).padStart(2, '0');
  const px = Array.from({ length: PX_ROWS }, () => Array(PX_COLS).fill(0));
  [...str].forEach((d, i) => FONT[d].forEach((row, r) => [...row].forEach((v, j) => {
    if (v === '1') px[r + 1][DIGIT_X[i] + j] = 1;
  })));
  if (settings.colon) COLON.forEach(([r, c]) => px[r][c] = 1);
  const P = (r, c) => (r >= 0 && c >= 0 && r < PX_ROWS && c < PX_COLS) ? px[r][c] : 0;
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const tl = P(r - 1, c - 1), tr = P(r - 1, c), bl = P(r, c - 1), br = P(r, c);
      const dirs = [];
      if (tl !== tr) dirs.push(0);
      if (tr !== br) dirs.push(90);
      if (bl !== br) dirs.push(180);
      if (tl !== bl) dirs.push(270);
      grid[r].push(dirs.length >= 2 ? [dirs[0], dirs[1]] : BLANK);
    }
  }
  return grid;
}

// Uhrzeit wächst von der Mitte nach außen heraus; der zweite Zeiger folgt dem ersten etwas verzögert
const showTime = (opts = {}) => {
  const g = timeLayout();
  return move((r, c) => g[r][c], {
    dur: 4200, dir: 'cw',
    delay: (r, c, k) => dist(r, c) * 260 + k * 380,
    ...opts,
  });
};

// ─── Choreografien ────────────────────────────────────────────────────────
const CR = (ROWS - 1) / 2, CC = (COLS - 1) / 2;
const dist = (r, c) => Math.hypot(r - CR, c - CC);
// Winkel, unter dem ein Zeiger von (r,c) aus zur Mitte zeigt
const toCenter = (r, c) => mod(Math.atan2(CC - c, -(CR - r)) * 180 / Math.PI, 360);

const CHOREOS = {
  // Vogelschwarm: ein driftendes Strömungsfeld; die Zeigerpaare öffnen und schließen sich wie Flügel
  Schwarm: () => flow((r, c, k, t) => {
    const x = c * .15, y = r * .15;
    const dir = noise(x + t * .07, y - t * .05, t * .045) * 560 + t * 18;
    const wing = 95 + 125 * noise(x * .7 + 31, y * .7 + 7, t * .09);
    return k ? dir + wing / 2 : dir - wing / 2;
  }, { delay: (r, c) => c * 120 }),

  // Kaleidoskop: ein Quadrant wird berechnet und an beiden Achsen gespiegelt
  Kaleidoskop: () => flow((r, c, k, t) => {
    let x = c - CC, y = r - CR;
    const mx = x < 0, my = y < 0; x = Math.abs(x); y = Math.abs(y);
    const d = Math.hypot(x, y);
    const a = noise(x * .21 - t * .05, y * .21 + t * .04, t * .06) * 480
            + Math.sin(d * .7 - t * .5) * 55 + t * 16;
    const s = 92 + 78 * Math.sin(t * .32 + d * .42);
    let ang = k ? a + s : a - s;
    if (mx) ang = -ang;
    if (my) ang = 180 - ang;
    return ang;
  }, { delay: (r, c) => dist(r, c) * 180 }),

  // Strömung: zwei wandernde Wellenquellen überlagern sich; Zeigerpaare bilden durchgehende Linien
  Strömung: () => flow((r, c, k, t) => {
    const p1x = CC + 6.5 * Math.sin(t * .17), p1y = CR + 3 * Math.cos(t * .13);
    const p2x = CC + 6.5 * Math.cos(t * .15 + 1), p2y = CR + 3 * Math.sin(t * .19 + 2);
    const d1 = Math.hypot(c - p1x, r - p1y), d2 = Math.hypot(c - p2x, r - p2y);
    const a = (Math.sin(d1 * .6 - t * .62) + Math.sin(d2 * .6 - t * .5)) * 62 + t * 7;
    return k ? a + 180 : a;
  }, { delay: (r, c) => (COLS - c) * 100 }),

  // Atem: Blütenblätter öffnen und schließen sich in Wellen von der Mitte nach außen
  Atem: () => flow((r, c, k, t) => {
    const d = dist(r, c), b = toCenter(r, c);
    const s = 92 - 86 * Math.cos(t * .8 - d * .55);
    return (k ? b + s : b - s) + Math.sin(t * .3) * 25;
  }, { delay: (r, c) => dist(r, c) * 220 }),

  Welle: async () => {
    await move(() => [0, 180], { dur: 1800, delay: (r, c) => c * 50 });
    await spin(() => 720, { dur: 4500, delay: (r, c) => c * 140 });
    await spin((r, c, k) => k ? -540 : 540, { dur: 4000, delay: (r) => r * 160 });
  },
  Wirbel: async () => {
    await move((r, c) => { const t = toCenter(r, c) + 90; return [t, t + 180]; }, { dur: 2200 });
    await spin(() => 720, { dur: 6000, delay: (r, c) => dist(r, c) * 180 });
    await move((r, c) => { const t = toCenter(r, c); return [t, t + 180]; }, { dur: 2500, delay: (r, c) => dist(r, c) * 120 });
  },
  Diagonalen: async () => {
    await move(() => [45, 225], { dur: 2000, delay: (r, c) => (r + c) * 40 });
    for (let i = 0; i < 4; i++) {
      await spin((r, c) => ((r + c) % 2 ? 90 : -90), { dur: 1600 });
      await sleep(250);
    }
  },
  Blüte: async () => {
    await move((r, c) => { const t = toCenter(r, c); return [t, t]; }, { dur: 2200 });
    await spin((r, c, k) => k ? -720 : 720, { dur: 6500, delay: (r, c) => dist(r, c) * 220 });
  },
  Schere: async () => {
    await move(() => [0, 0], { dur: 2000, delay: (r, c) => r * 60 });
    await spin(() => 1080, { dur: 7000, delay: (r, c, k) => r * 90 + c * 40 + k * 700 });
  },
};
const CHOREO_NAMES = ['Schwarm', 'Welle', 'Kaleidoskop', 'Wirbel', 'Strömung', 'Diagonalen', 'Atem', 'Blüte', 'Schere'];

// ─── Ablauf ───────────────────────────────────────────────────────────────
const settings = { mode: 'aktiv', theme: 'white', h12: false, colon: true };
let forced = null, choreoIdx = 0;
const statusEl = document.getElementById('status');

async function waitUntil(pred) { while (!pred() && !forced) await sleep(100); }

async function run() {
  await showTime({ dur: 3500 });
  while (true) {
    const sec = () => new Date().getSeconds();
    if (settings.mode === 'aktiv') await waitUntil(() => sec() >= 27);
    else if (settings.mode === 'demo') { const t = Date.now() + 5000; await waitUntil(() => Date.now() > t); }
    else { const m = new Date().getMinutes(); await waitUntil(() => new Date().getMinutes() !== m); }

    if (settings.mode !== 'minimal' || forced) {
      const name = forced || CHOREO_NAMES[choreoIdx++ % CHOREO_NAMES.length];
      forced = null;
      statusEl.textContent = name;
      await CHOREOS[name]();
      statusEl.textContent = '';
      if (settings.mode === 'aktiv') await waitUntil(() => sec() < 30); // bis zur neuen Minute
    }
    await showTime();
  }
}

// ─── Zeichnen ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let geo = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let colors = {};
const readColors = () => {
  colors = { panel: css('--panel'), face: css('--face'), hand: css('--hand'),
             shade: css('--shade'), light: css('--light'), handShadow: css('--hand-shadow') };
  buildFace();
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const maxW = innerWidth * .94, maxH = innerHeight * .9;
  const w = Math.min(maxW, maxH * PANEL_W / PANEL_H), h = w * PANEL_H / PANEL_W;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pitch = Math.min(w / (COLS + .6), h / (ROWS + .6));
  geo = { w, h, dpr, pitch, ox: (w - pitch * COLS) / 2 + pitch / 2, oy: (h - pitch * ROWS) / 2 + pitch / 2, R: pitch * .44 };
  buildFace();
}

// Ein Uhrenfeld wird einmal vorgerendert: eine in die Platte eingefräste Mulde,
// Licht von oben links → Schatten an der oberen linken Innenkante, Lichtkante unten rechts.
let faceSprite = null;
function buildFace() {
  if (!geo.R || !colors.face) return;
  const { R, dpr } = geo, pad = Math.ceil(R * .25), S = Math.ceil((R + pad) * 2);
  const off = document.createElement('canvas');
  off.width = S * dpr; off.height = S * dpr;
  const g = off.getContext('2d'); g.scale(dpr, dpr);
  const cx = S / 2, cy = S / 2;
  const circle = (rad = R) => { g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); };

  if (settings.theme === 'neo') {
    // Neobrutalismus: flache Fläche, dicke Kontur, harter Schlagschatten ohne Weichzeichnung
    const o = R * .14;
    g.beginPath(); g.arc(cx + o, cy + o, R, 0, Math.PI * 2); g.fillStyle = colors.shade; g.fill();
    circle(); g.fillStyle = colors.face; g.fill();
    g.lineWidth = Math.max(1.5, R * .09); g.strokeStyle = colors.shade; g.stroke();
    faceSprite = { img: off, S };
    return;
  }

  // Grundfläche der Mulde: zur Mitte unten rechts etwas heller
  const rg = g.createRadialGradient(cx + R * .25, cy + R * .3, R * .1, cx, cy, R * 1.05);
  rg.addColorStop(0, colors.face);
  rg.addColorStop(1, colors.panel);
  circle(); g.fillStyle = rg; g.fill();

  // Innenschatten: fällt von der oberen linken Kante in die Mulde
  g.save(); circle(); g.clip();
  g.beginPath(); g.rect(0, 0, S, S); g.arc(cx, cy, R, 0, Math.PI * 2, true);
  g.shadowColor = colors.shade; g.shadowBlur = R * .35;
  g.shadowOffsetX = R * .1 * dpr; g.shadowOffsetY = R * .16 * dpr;
  g.fillStyle = '#000'; g.fill();
  g.restore();

  // Lichtkante unten rechts, dunkle Schnittkante oben links
  const lg = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  lg.addColorStop(0, colors.shade); lg.addColorStop(.45, 'rgba(0,0,0,0)');
  lg.addColorStop(.6, 'rgba(0,0,0,0)'); lg.addColorStop(1, colors.light);
  circle(R - .5); g.lineWidth = Math.max(1, R * .045); g.strokeStyle = lg; g.stroke();

  faceSprite = { img: off, S };
}

function draw() {
  const { w, h, pitch, ox, oy, R } = geo;
  ctx.fillStyle = colors.panel; ctx.fillRect(0, 0, w, h);
  const neo = settings.theme === 'neo';
  const L = R * .93, lw = Math.max(1.5, R * (neo ? .17 : .13));
  const sx = R * .07, sy = R * .11;          // Versatz des Zeigerschattens
  ctx.lineCap = neo ? 'square' : 'round';
  const handPath = (x, y, hs, dx = 0, dy = 0) => {
    ctx.beginPath();
    for (const hd of hs) {
      const a = hd.a * Math.PI / 180;
      ctx.moveTo(x + dx, y + dy); ctx.lineTo(x + dx + Math.sin(a) * L, y + dy - Math.cos(a) * L);
    }
  };
  forEachClock((r, c, hs) => {
    const x = ox + c * pitch, y = oy + r * pitch;
    if (faceSprite) ctx.drawImage(faceSprite.img, x - faceSprite.S / 2, y - faceSprite.S / 2, faceSprite.S, faceSprite.S);
    // weicher Schatten der Zeiger auf dem Zifferblatt (zwei Lagen statt teurem Blur)
    if (!neo) {
    ctx.strokeStyle = colors.handShadow;
    ctx.lineWidth = lw * 3.0; handPath(x, y, hs, sx * 1.4, sy * 1.4); ctx.stroke();
    ctx.lineWidth = lw * 1.9; handPath(x, y, hs, sx * 1.1, sy * 1.1); ctx.stroke();
    ctx.lineWidth = lw * 1.1; handPath(x, y, hs, sx * .8, sy * .8); ctx.stroke();
    }
    ctx.strokeStyle = colors.hand; ctx.lineWidth = lw; handPath(x, y, hs); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, lw * .55, 0, Math.PI * 2); ctx.fillStyle = colors.hand; ctx.fill();
  });
}

function frame(now) { updateHands(now); draw(); requestAnimationFrame(frame); }

// ─── Bedienleiste ─────────────────────────────────────────────────────────
const ui = document.getElementById('ui');
function btn(label, onClick, isOn) {
  const b = document.createElement('button'); b.textContent = label;
  b.onclick = () => { onClick(); renderUI(); }; if (isOn && isOn()) b.classList.add('on');
  ui.appendChild(b);
}
const sep = () => { const s = document.createElement('div'); s.className = 'sep'; ui.appendChild(s); };
function renderUI() {
  ui.innerHTML = '';
  for (const m of ['aktiv', 'demo', 'minimal']) btn(m[0].toUpperCase() + m.slice(1), () => { settings.mode = m; save(); }, () => settings.mode === m);
  sep();
  for (const n of CHOREO_NAMES) btn(n, () => { forced = n; });
  sep();
  for (const [t, label] of [['white', 'Weiß'], ['black', 'Schwarz'], ['neo', 'Neo']])
    btn(label, () => { settings.theme = t; applyTheme(); save(); }, () => settings.theme === t);
  btn(settings.h12 ? '24h' : '12h', () => { settings.h12 = !settings.h12; save(); });
  btn(settings.colon ? 'Ohne :' : 'Mit :', () => { settings.colon = !settings.colon; save(); });
  btn('Vollbild', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
}
function applyTheme() { document.documentElement.dataset.theme = settings.theme; readColors(); }
function save() { try { localStorage.setItem('onetwenty', JSON.stringify(settings)); } catch (e) {} }
try { Object.assign(settings, JSON.parse(localStorage.getItem('onetwenty') || '{}')); } catch (e) {}
const q = new URLSearchParams(location.search);
if (q.get('mode')) settings.mode = q.get('mode');
if (q.get('theme')) settings.theme = q.get('theme');

// Bedienleiste ausblenden, wenn die Maus ruht
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); };
['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake));

addEventListener('resize', resize);
applyTheme(); resize(); renderUI(); wake();
requestAnimationFrame(frame);
run();
</script>
</body>
