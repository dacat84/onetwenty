<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onetwenty</title>
<meta name="description" content="120 analoge Uhren, choreografiert – eine digitale Hommage an kinetische Uhrenkunst.">
<style>
  :root {
    --wall: #d9d6cf;
    --panel: #ecebe6;
    --face: #f4f3ef;
    --face-edge: rgba(0,0,0,.10);
    --hand: #161616;
    --ui-bg: rgba(255,255,255,.75);
    --ui-fg: #222;
  }
  :root[data-theme="black"] {
    --wall: #2a2a2a;
    --panel: #141414;
    --face: #1b1b1b;
    --face-edge: rgba(255,255,255,.06);
    --hand: #f1f1f1;
    --ui-bg: rgba(20,20,20,.75);
    --ui-fg: #eee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--wall);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ui-fg);
    overflow: hidden;
    display: grid;
    place-items: center;
    transition: background .6s;
  }
  canvas { display: block; }
  #ui {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    max-width: calc(100vw - 32px);
    padding: 8px; border-radius: 12px;
    background: var(--ui-bg); backdrop-filter: blur(8px);
    transition: opacity .5s;
  }
  body.idle #ui { opacity: 0; pointer-events: none; }
  #ui button {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid currentColor; border-radius: 8px;
    padding: 5px 10px; cursor: pointer; opacity: .75;
  }
  #ui button:hover { opacity: 1; }
  #ui button.on { opacity: 1; background: var(--hand); color: var(--panel); border-color: var(--hand); }
  #ui .sep { width: 1px; background: currentColor; opacity: .25; margin: 2px 4px; }
  #status { position: fixed; top: 12px; left: 16px; font-size: 12px; opacity: .55; }
  body.idle #status { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="ui"></div>

<script>
// ─── Grundgrößen ──────────────────────────────────────────────────────────
const ROWS = 8, COLS = 18;               // 8 × 18 = 144 Uhren
const PANEL_W = COLS + .8, PANEL_H = ROWS + .8;  // Seitenverhältnis folgt dem Raster

// Winkel in Grad: 0 = 12 Uhr, im Uhrzeigersinn
const mod = (a, n) => ((a % n) + n) % n;
const shortDelta = (from, to) => mod(to - from + 180, 360) - 180;
const ease = {
  inOut: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
  sine:  p => -(Math.cos(Math.PI * p) - 1) / 2,
  linear: p => p,
};
// Kubische Bézier-Kurve wie in CSS: weicher Anlauf, langer, sanfter Auslauf
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  const dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return p => {
    let t = p;
    for (let i = 0; i < 6; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - p) / d; }
    return Y(Math.min(1, Math.max(0, t)));
  };
}
ease.organic = bezier(.42, 0, .18, 1);
ease.drift = bezier(.35, 0, .25, 1);

// Bewegungscharakter – hier lässt sich das „Gefühl“ zentral nachjustieren
const FEEL = {
  tempo: 1.35,        // > 1 = alles langsamer
  jitterDelay: 450,   // ms Zufallsversatz pro Zeiger
  jitterDur: .14,     // ± Anteil Zufallsstreuung der Dauer
  overshoot: 5,       // Grad, die ein Zeiger über das Ziel hinausschwingt (max.)
};
const rand = (a, b) => a + Math.random() * (b - a);

// ─── Zustand der Zeiger ───────────────────────────────────────────────────
const clocks = [];
for (let r = 0; r < ROWS; r++) {
  clocks.push([]);
  for (let c = 0; c < COLS; c++) clocks[r].push([{ a: 225, tw: null }, { a: 225, tw: null }]);
}
const forEachClock = fn => { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fn(r, c, clocks[r][c]); };

function updateHands(now) {
  forEachClock((r, c, hs) => {
    for (const h of hs) {
      const t = h.tw; if (!t || now < t.t0) continue;
      const p = Math.min(1, (now - t.t0) / t.dur);
      const delta = t.to - t.from;
      // weiches Überschwingen kurz vor dem Ziel, das wieder zurückpendelt
      const ov = Math.min(FEEL.overshoot, Math.abs(delta) * .04) * Math.sign(delta);
      const bump = p > .62 ? Math.sin(Math.PI * (p - .62) / .38) * Math.pow(1 - p, .6) * 1.6 : 0;
      h.a = t.from + delta * t.ease(p) + ov * bump;
      if (p >= 1) { h.a = mod(t.to, 360); h.tw = null; }
    }
  });
}

const sleep = ms => new Promise(res => setTimeout(res, ms));

// Dauer und Startzeit pro Zeiger mit Tempo und Zufallsstreuung versehen
function timing(dur, delayMs, jitter) {
  const j = jitter ?? 1;
  const d = dur * FEEL.tempo * (1 + rand(-FEEL.jitterDur, FEEL.jitterDur) * j);
  const st = delayMs * FEEL.tempo + rand(0, FEEL.jitterDelay) * j;
  return [d, st];
}

// Zielposition anfahren. fn(r,c) → [winkel0, winkel1] oder null
function move(fn, { dur = 2000, delay = () => 0, dir = 'short', turns = 0, easing = ease.organic, jitter } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => {
    let t = fn(r, c); if (!t) return;
    let [t0, t1] = t;
    if (dir === 'short') {           // Zeiger so zuordnen, dass der Weg minimal ist
      const cost = (x, y) => Math.abs(shortDelta(hs[0].a, x)) + Math.abs(shortDelta(hs[1].a, y));
      if (cost(t1, t0) < cost(t0, t1)) [t0, t1] = [t1, t0];
    }
    [t0, t1].forEach((to, k) => {
      const h = hs[k];
      const d = typeof dir === 'function' ? dir(r, c, k) : dir;
      let delta;
      if (d === 'cw') delta = mod(to - h.a, 360) + 360 * turns;
      else if (d === 'ccw') delta = -mod(h.a - to, 360) - 360 * turns;
      else delta = shortDelta(h.a, to) + Math.sign(shortDelta(h.a, to) || 1) * 360 * turns;
      const [dd, sd] = timing(dur, delay(r, c, k), jitter);
      const st = now + sd;
      h.tw = { from: h.a, to: h.a + delta, t0: st, dur: dd, ease: easing };
      end = Math.max(end, st + dd);
    });
  });
  return sleep(end - now);
}

// Relativ drehen. fn(r,c,k) → Grad (positiv = im Uhrzeigersinn)
function spin(fn, { dur = 3000, delay = () => 0, easing = ease.drift, jitter } = {}) {
  const now = performance.now(); let end = now;
  forEachClock((r, c, hs) => hs.forEach((h, k) => {
    const delta = fn(r, c, k); if (!delta) return;
    const [dd, sd] = timing(dur, delay(r, c, k), jitter);
    const st = now + sd;
    h.tw = { from: h.a, to: h.a + delta, t0: st, dur: dd, ease: easing };
    end = Math.max(end, st + dd);
  }));
  return sleep(end - now);
}

// ─── Ziffern als Konturschrift ────────────────────────────────────────────
// Jede Ziffer ist ein 3 × 5 Pixel-Bitmap. Ein „Pixel“ ist das Quadrat zwischen vier Uhren.
// Gezeichnet wird nur der Umriss der gefüllten Pixel – ein Umriss verzweigt sich nie,
// deshalb braucht jede Uhr genau zwei Zeiger.
const FONT = {
  0: ['111', '101', '101', '101', '111'],
  1: ['110', '010', '010', '010', '111'],
  2: ['111', '001', '111', '100', '111'],
  3: ['111', '001', '111', '001', '111'],
  4: ['101', '101', '111', '001', '001'],
  5: ['111', '100', '111', '001', '111'],
  6: ['111', '100', '111', '101', '111'],
  7: ['111', '001', '001', '001', '001'],
  8: ['111', '101', '111', '101', '111'],
  9: ['111', '101', '111', '001', '111'],
};
const PX_ROWS = ROWS - 1, PX_COLS = COLS - 1;   // 7 × 17 Pixel
const DIGIT_X = [0, 4, 10, 14];                 // Pixelspalte jeder Ziffer (symmetrisch)
const COLON = [[2, 8], [4, 8]];                 // zwei Punkte als kleine Quadrate
const BLANK = [225, 225];

function timeLayout(date = new Date()) {
  let h = date.getHours(); const m = date.getMinutes();
  if (settings.h12) h = h % 12 || 12;
  const str = String(h).padStart(2, '0') + String(m).padStart(2, '0');
  const px = Array.from({ length: PX_ROWS }, () => Array(PX_COLS).fill(0));
  [...str].forEach((d, i) => FONT[d].forEach((row, r) => [...row].forEach((v, j) => {
    if (v === '1') px[r + 1][DIGIT_X[i] + j] = 1;
  })));
  if (settings.colon) COLON.forEach(([r, c]) => px[r][c] = 1);
  const P = (r, c) => (r >= 0 && c >= 0 && r < PX_ROWS && c < PX_COLS) ? px[r][c] : 0;
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push([]);
    for (let c = 0; c < COLS; c++) {
      const tl = P(r - 1, c - 1), tr = P(r - 1, c), bl = P(r, c - 1), br = P(r, c);
      const dirs = [];
      if (tl !== tr) dirs.push(0);
      if (tr !== br) dirs.push(90);
      if (bl !== br) dirs.push(180);
      if (tl !== bl) dirs.push(270);
      grid[r].push(dirs.length >= 2 ? [dirs[0], dirs[1]] : BLANK);
    }
  }
  return grid;
}

// Uhrzeit wächst von der Mitte nach außen heraus; der zweite Zeiger folgt dem ersten etwas verzögert
const showTime = (opts = {}) => {
  const g = timeLayout();
  return move((r, c) => g[r][c], {
    dur: 4200, dir: 'cw',
    delay: (r, c, k) => dist(r, c) * 260 + k * 380,
    ...opts,
  });
};

// ─── Choreografien ────────────────────────────────────────────────────────
const CR = (ROWS - 1) / 2, CC = (COLS - 1) / 2;
const dist = (r, c) => Math.hypot(r - CR, c - CC);
// Winkel, unter dem ein Zeiger von (r,c) aus zur Mitte zeigt
const toCenter = (r, c) => mod(Math.atan2(CC - c, -(CR - r)) * 180 / Math.PI, 360);

const CHOREOS = {
  Welle: async () => {
    await move(() => [0, 180], { dur: 1800, delay: (r, c) => c * 50 });
    await spin(() => 720, { dur: 4500, delay: (r, c) => c * 140 });
    await spin((r, c, k) => k ? -540 : 540, { dur: 4000, delay: (r) => r * 160 });
  },
  Wirbel: async () => {
    await move((r, c) => { const t = toCenter(r, c) + 90; return [t, t + 180]; }, { dur: 2200 });
    await spin(() => 720, { dur: 6000, delay: (r, c) => dist(r, c) * 180 });
    await move((r, c) => { const t = toCenter(r, c); return [t, t + 180]; }, { dur: 2500, delay: (r, c) => dist(r, c) * 120 });
  },
  Diagonalen: async () => {
    await move(() => [45, 225], { dur: 2000, delay: (r, c) => (r + c) * 40 });
    for (let i = 0; i < 4; i++) {
      await spin((r, c) => ((r + c) % 2 ? 90 : -90), { dur: 1600 });
      await sleep(250);
    }
  },
  Blüte: async () => {
    await move((r, c) => { const t = toCenter(r, c); return [t, t]; }, { dur: 2200 });
    await spin((r, c, k) => k ? -720 : 720, { dur: 6500, delay: (r, c) => dist(r, c) * 220 });
  },
  Schere: async () => {
    await move(() => [0, 0], { dur: 2000, delay: (r, c) => r * 60 });
    await spin(() => 1080, { dur: 7000, delay: (r, c, k) => r * 90 + c * 40 + k * 700 });
  },
};
const CHOREO_NAMES = Object.keys(CHOREOS);

// ─── Ablauf ───────────────────────────────────────────────────────────────
const settings = { mode: 'aktiv', theme: 'white', h12: false, colon: true };
let forced = null, choreoIdx = 0;
const statusEl = document.getElementById('status');

async function waitUntil(pred) { while (!pred() && !forced) await sleep(100); }

async function run() {
  await showTime({ dur: 3500 });
  while (true) {
    const sec = () => new Date().getSeconds();
    if (settings.mode === 'aktiv') await waitUntil(() => sec() >= 33);
    else if (settings.mode === 'demo') { const t = Date.now() + 5000; await waitUntil(() => Date.now() > t); }
    else { const m = new Date().getMinutes(); await waitUntil(() => new Date().getMinutes() !== m); }

    if (settings.mode !== 'minimal' || forced) {
      const name = forced || CHOREO_NAMES[choreoIdx++ % CHOREO_NAMES.length];
      forced = null;
      statusEl.textContent = name;
      await CHOREOS[name]();
      statusEl.textContent = '';
      if (settings.mode === 'aktiv') await waitUntil(() => sec() < 30); // bis zur neuen Minute
    }
    await showTime();
  }
}

// ─── Zeichnen ─────────────────────────────────────────────────────────────
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let geo = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let colors = {};
const readColors = () => colors = { panel: css('--panel'), face: css('--face'), edge: css('--face-edge'), hand: css('--hand') };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const maxW = innerWidth * .94, maxH = innerHeight * .9;
  const w = Math.min(maxW, maxH * PANEL_W / PANEL_H), h = w * PANEL_H / PANEL_W;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pitch = Math.min(w / (COLS + .6), h / (ROWS + .6));
  geo = { w, h, pitch, ox: (w - pitch * COLS) / 2 + pitch / 2, oy: (h - pitch * ROWS) / 2 + pitch / 2, R: pitch * .44 };
}

function draw() {
  const { w, h, pitch, ox, oy, R } = geo;
  ctx.fillStyle = colors.panel; ctx.fillRect(0, 0, w, h);
  const L = R * .93, lw = Math.max(1.5, R * .13);
  ctx.lineCap = 'round';
  forEachClock((r, c, hs) => {
    const x = ox + c * pitch, y = oy + r * pitch;
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fillStyle = colors.face; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = colors.edge; ctx.stroke();
    ctx.strokeStyle = colors.hand; ctx.lineWidth = lw;
    for (const hd of hs) {
      const a = hd.a * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(a) * L, y - Math.cos(a) * L); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, lw * .55, 0, Math.PI * 2); ctx.fillStyle = colors.hand; ctx.fill();
  });
}

function frame(now) { updateHands(now); draw(); requestAnimationFrame(frame); }

// ─── Bedienleiste ─────────────────────────────────────────────────────────
const ui = document.getElementById('ui');
function btn(label, onClick, isOn) {
  const b = document.createElement('button'); b.textContent = label;
  b.onclick = () => { onClick(); renderUI(); }; if (isOn && isOn()) b.classList.add('on');
  ui.appendChild(b);
}
const sep = () => { const s = document.createElement('div'); s.className = 'sep'; ui.appendChild(s); };
function renderUI() {
  ui.innerHTML = '';
  for (const m of ['aktiv', 'demo', 'minimal']) btn(m[0].toUpperCase() + m.slice(1), () => { settings.mode = m; save(); }, () => settings.mode === m);
  sep();
  for (const n of CHOREO_NAMES) btn(n, () => { forced = n; });
  sep();
  btn(settings.theme === 'white' ? 'Schwarz' : 'Weiß', () => { settings.theme = settings.theme === 'white' ? 'black' : 'white'; applyTheme(); save(); });
  btn(settings.h12 ? '24h' : '12h', () => { settings.h12 = !settings.h12; save(); });
  btn(settings.colon ? 'Ohne :' : 'Mit :', () => { settings.colon = !settings.colon; save(); });
  btn('Vollbild', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
}
function applyTheme() { document.documentElement.dataset.theme = settings.theme; readColors(); }
function save() { try { localStorage.setItem('onetwenty', JSON.stringify(settings)); } catch (e) {} }
try { Object.assign(settings, JSON.parse(localStorage.getItem('onetwenty') || '{}')); } catch (e) {}
const q = new URLSearchParams(location.search);
if (q.get('mode')) settings.mode = q.get('mode');
if (q.get('theme')) settings.theme = q.get('theme');

// Bedienleiste ausblenden, wenn die Maus ruht
let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); };
['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, wake));

addEventListener('resize', resize);
applyTheme(); resize(); renderUI(); wake();
requestAnimationFrame(frame);
run();
</script>
</body>
</html>
